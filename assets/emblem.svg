<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Fresco Dairy Farms emblem">
  <circle cx="100" cy="100" r="92" fill="#fbf3e7" stroke="#33492e" stroke-width="3"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#33492e" stroke-width="1"/>

  <!-- mountains -->
  <path d="M38,112 L64,68 L82,112 L100,55 L118,112 L136,72 L162,112 Z" fill="#33492e"/>

  <!-- pine trees -->
